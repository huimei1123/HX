<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>生辰喜乐 · 旋转蛋糕</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060f;
    -webkit-tap-highlight-color:transparent;cursor:pointer;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function(){
'use strict';

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let S = 1;                 // 世界坐标 -> 屏幕缩放
let baseX = 0, baseY = 0;  // 蛋糕底部中心在屏幕上的位置

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  S = Math.min(W * 0.82 / 260, H * 0.34 / 180);
  baseX = W / 2;
  baseY = H * 0.76;
}
window.addEventListener('resize', resize);
resize();

/* ================= 全局状态 ================= */
let time = 0;
let angle = 0;
let candleLight = 1;       // 当前火焰强度
let targetLight = 1;       // 目标火焰强度
let mouseX = 0, mouseY = 0;
let parX = 0, parY = 0;
let nextBoom = 2.5;

const COS_P = Math.cos(0.40);   // 相机俯视角
const SIN_P = Math.sin(0.40);

/* ================= 3D 投影 ================= */
function project(x, y, z) {
  const ca = Math.cos(angle), sa = Math.sin(angle);
  const rx = x * ca - z * sa;
  const rz = x * sa + z * ca;
  return {
    x: baseX + rx * S,
    y: baseY - (y * COS_P - rz * SIN_P) * S,
    z: rz
  };
}

/* ================= 星空 ================= */
const stars = [];
for (let i = 0; i < 170; i++) {
  stars.push({
    x: Math.random(), y: Math.random(),
    r: 0.3 + Math.random() * 1.4,
    ph: Math.random() * Math.PI * 2,
    sp: 0.8 + Math.random() * 2.2
  });
}

/* ================= 粒子 ================= */
const sparks = [];
const fireworks = [];
const smoke = [];

function spawnSpark() {
  if (sparks.length > 80) return;
  sparks.push({
    x: baseX + (Math.random() - 0.5) * Math.min(420, W * 0.7),
    y: baseY - 40,
    vx: (Math.random() - 0.5) * 0.7,
    vy: -(0.5 + Math.random() * 1.3),
    r: 0.8 + Math.random() * 2.2,
    life: 0,
    maxLife: 3 + Math.random() * 3,
    hue: 28 + Math.random() * 34
  });
}

function boom(x, y) {
  const hue = Math.random() * 360;
  const n = 56 + Math.floor(Math.random() * 34);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.35;
    const sp = 1.6 + Math.random() * 3.8;
    fireworks.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      r: 1 + Math.random() * 2,
      life: 0,
      maxLife: 1 + Math.random() * 1.1,
      hue: hue + Math.random() * 40
    });
  }
}

function spawnSmoke(x, y) {
  if (smoke.length > 60) return;
  smoke.push({
    x: x + (Math.random() - 0.5) * 6,
    y,
    vx: (Math.random() - 0.5) * 0.7,
    vy: -0.5 - Math.random() * 0.9,
    r: 2 + Math.random() * 3.5,
    life: 0,
    maxLife: 1.6 + Math.random() * 1.3
  });
}

/* ================= 蛋糕层定义 ================= */
const LAYERS = [
  { y0: 0,   y1: 72,  r: 130, dark: [118, 56, 32],  light: [248, 190, 142], top: '#ffe6c8' },
  { y0: 72,  y1: 132, r: 100, dark: [138, 68, 38],  light: [255, 208, 164], top: '#fff2dd' },
  { y0: 132, y1: 182, r: 72,  dark: [156, 82, 46],  light: [255, 224, 188], top: '#fffaf0' }
];

/* ================= 背景 ================= */
function drawBackground() {
  const g = ctx.createRadialGradient(
    W * 0.5, H * 0.44, 0,
    W * 0.5, H * 0.44, Math.max(W, H) * 0.82
  );
  g.addColorStop(0,    '#1b2149');
  g.addColorStop(0.45, '#0e1230');
  g.addColorStop(1,    '#04050c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const a = 0.15 + 0.85 * Math.pow(Math.sin(time * s.sp + s.ph) * 0.5 + 0.5, 2.2);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ================= 地面阴影与盘子 ================= */
function drawGround() {
  const c = project(0, 0, 0);

  // 阴影
  ctx.save();
  ctx.translate(c.x, c.y + 6 * S);
  ctx.scale(1, SIN_P * 0.95);
  const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, 150 * S);
  sg.addColorStop(0,   'rgba(0,0,0,0.55)');
  sg.addColorStop(0.6, 'rgba(0,0,0,0.20)');
  sg.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(0, 0, 150 * S, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 盘子
  ctx.beginPath();
  ctx.ellipse(c.x, c.y, 152 * S, 152 * S * SIN_P, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(200,215,255,0.08)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(205,222,255,0.35)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
}

/* ================= 圆柱侧面 ================= */
function drawSide(L) {
  const N = 56;
  for (let i = 0; i < N; i++) {
    const a0  = i / N * Math.PI * 2;
    const a1  = (i + 1) / N * Math.PI * 2;
    const mid = (a0 + a1) / 2;
    const phi = mid + angle;
    const sn  = Math.sin(phi);
    if (sn <= 0.001) continue;   // 背面不可见

    const p0 = project(L.r * Math.cos(a0), L.y0, L.r * Math.sin(a0));
    const p1 = project(L.r * Math.cos(a1), L.y0, L.r * Math.sin(a1));
    const p2 = project(L.r * Math.cos(a1), L.y1, L.r * Math.sin(a1));
    const p3 = project(L.r * Math.cos(a0), L.y1, L.r * Math.sin(a0));

    const cn = Math.cos(phi);
    let diff = (-0.52 * cn + 0.78 * sn) / 0.94;
    if (diff < 0) diff = 0;
    const t = 0.16 + 0.84 * diff;

    const r = Math.round(L.dark[0] + (L.light[0] - L.dark[0]) * t);
    const g = Math.round(L.dark[1] + (L.light[1] - L.dark[1]) * t);
    const b = Math.round(L.dark[2] + (L.light[2] - L.dark[2]) * t);
    const col = `rgb(${r},${g},${b})`;

    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    ctx.strokeStyle = col;      // 消除相邻面片缝隙
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

/* ================= 圆柱顶面 ================= */
function drawTop(L) {
  const N = 56;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const a = i / N * Math.PI * 2;
    const p = project(L.r * Math.cos(a), L.y1, L.r * Math.sin(a));
    if (i === 0) ctx.moveTo(p.x, p.y);
    else         ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();

  const c   = project(0, L.y1, 0);
  const rad = L.r * S;
  const g = ctx.createRadialGradient(
    c.x - rad * 0.32, c.y - rad * 0.16, rad * 0.05,
    c.x, c.y, rad * 1.05
  );
  g.addColorStop(0,   '#ffffff');
  g.addColorStop(0.45, L.top);
  g.addColorStop(1,   'rgba(255,232,205,0.92)');
  ctx.fillStyle = g;
  ctx.fill();
}

/* ================= 顶面奶油球 ================= */
function drawDecor(L) {
  const count = Math.max(10, Math.round(L.r / 7.5));
  const items = [];
  for (let i = 0; i < count; i++) {
    const a = i / count * Math.PI * 2;
    const p = project(
      L.r * 0.86 * Math.cos(a),
      L.y1 + 4,
      L.r * 0.86 * Math.sin(a)
    );
    items.push({ p: p, phi: a + angle });
  }
  items.sort(function (A, B) { return A.p.z - B.p.z; });

  const rad = Math.max(2.4, L.r * 0.036) * S;
  for (const it of items) {
    const sn = Math.sin(it.phi);
    const bright = 0.5 + 0.5 * Math.max(0, sn);

    ctx.beginPath();
    ctx.arc(it.p.x, it.p.y, rad, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${Math.round(235 * bright + 20)},${Math.round(90 * bright + 30)},${Math.round(120 * bright + 40)},${0.55 + 0.45 * bright})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(it.p.x - rad * 0.32, it.p.y - rad * 0.32, rad * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.55 * bright})`;
    ctx.fill();
  }
}

/* ================= 火焰 ================= */
function drawFlame(fx, fy) {
  const L = candleLight;
  if (L <= 0.015) return;

  const flick = 1 + 0.16 * Math.sin(time * 21) + 0.09 * Math.sin(time * 13.7 + 1.1);
  const fh = 22 * S * L * flick;
  const fw = 10 * S * L * flick;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // 大光晕
  const glowR = 150 * S * L * flick;
  const gg = ctx.createRadialGradient(fx, fy - fh * 0.4, 0, fx, fy - fh * 0.4, glowR);
  gg.addColorStop(0,    `rgba(255,196,100,${0.30 * L})`);
  gg.addColorStop(0.35, `rgba(255,140,60,${0.12 * L})`);
  gg.addColorStop(1,    'rgba(255,110,30,0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(fx, fy - fh * 0.4, glowR, 0, Math.PI * 2);
  ctx.fill();

  // 火焰本体
  const fg = ctx.createRadialGradient(fx, fy - fh * 0.5, 0, fx, fy - fh * 0.5, fh);
  fg.addColorStop(0,    'rgba(255,255,225,0.98)');
  fg.addColorStop(0.35, 'rgba(255,200,80,0.90)');
  fg.addColorStop(0.72, 'rgba(255,120,30,0.55)');
  fg.addColorStop(1,    'rgba(255,70,0,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.ellipse(fx, fy - fh * 0.5, fw * 0.55, fh * 0.78, 0, 0, Math.PI * 2);
  ctx.fill();

  // 内焰
  const ig = ctx.createRadialGradient(fx, fy - fh * 0.42, 0, fx, fy - fh * 0.42, fh * 0.42);
  ig.addColorStop(0, 'rgba(255,255,255,1)');
  ig.addColorStop(1, 'rgba(255,245,190,0)');
  ctx.fillStyle = ig;
  ctx.beginPath();
  ctx.ellipse(fx, fy - fh * 0.42, fw * 0.28, fh * 0.40, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* ================= 蜡烛 ================= */
function drawCandle() {
  const yBase = 182;
  const yTop  = 182 + 42;

  const pB = project(0, yBase, 0);
  const pT = project(0, yTop, 0);

  const cw  = Math.max(6, 9 * S);
  const hgt = pB.y - pT.y;
  if (hgt <= 0) return;

  const left  = pB.x - cw / 2;
  const right = pB.x + cw / 2;

  // 柱体
  const g = ctx.createLinearGradient(left, 0, right, 0);
  g.addColorStop(0,    '#ddcbb4');
  g.addColorStop(0.32, '#fffdf6');
  g.addColorStop(0.68, '#fff7e9');
  g.addColorStop(1,    '#d4c2aa');
  ctx.fillStyle = g;
  ctx.fillRect(left, pT.y, cw, hgt);

  // 螺旋红纹
  ctx.strokeStyle = 'rgba(240,78,110,0.92)';
  ctx.lineWidth = Math.max(1.4, 2.1 * S);
  for (let i = 0; i < 4; i++) {
    const y = pT.y + hgt * (0.14 + i * 0.22);
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y + hgt * 0.055);
    ctx.stroke();
  }

  // 灯芯
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(pB.x, pT.y);
  ctx.lineTo(pB.x, pT.y - 5 * S);
  ctx.stroke();

  drawFlame(pB.x, pT.y - 5 * S);
}

/* ================= 蛋糕整体 ================= */
function drawCake() {
  drawGround();

  for (const L of LAYERS) {
    drawSide(L);
    drawTop(L);
    drawDecor(L);
  }

  drawCandle();
}

/* ================= 粒子更新与绘制 ================= */
function updateParticles() {
  if (sparks.length < 70 && Math.random() < 0.35) spawnSpark();

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life += 0.016;
    s.x += s.vx;
    s.y += s.vy;
    s.vy -= 0.004;
    if (s.life > s.maxLife) sparks.splice(i, 1);
  }

  for (let i = fireworks.length - 1; i >= 0; i--) {
    const f = fireworks[i];
    f.life += 0.016;
    f.x += f.vx;
    f.y += f.vy;
    f.vy += 0.055;
    f.vx *= 0.986;
    f.vy *= 0.986;
    if (f.life > f.maxLife) fireworks.splice(i, 1);
  }

  for (let i = smoke.length - 1; i >= 0; i--) {
    const s = smoke[i];
    s.life += 0.016;
    s.x += s.vx;
    s.y += s.vy;
    s.vy *= 0.99;
    s.r += 0.08;
    if (s.life > s.maxLife) smoke.splice(i, 1);
  }

  // 自动烟花
  nextBoom -= 0.016;
  if (nextBoom <= 0) {
    boom(W * (0.15 + Math.random() * 0.7), H * (0.10 + Math.random() * 0.30));
    nextBoom = 3 + Math.random() * 3.5;
  }
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  for (const s of sparks) {
    const t = s.life / s.maxLife;
    const a = Math.sin(Math.PI * t) * 0.9;
    ctx.fillStyle = `hsla(${s.hue},100%,72%,${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * (0.6 + 0.4 * Math.sin(t * 6)), 0, Math.PI * 2);
    ctx.fill();
  }

  for (const f of fireworks) {
    const t = f.life / f.maxLife;
    const a = Math.pow(1 - t, 2);
    ctx.fillStyle = `hsla(${f.hue},100%,66%,${a})`;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * (1 - t * 0.6), 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();

  for (const s of smoke) {
    const t = s.life / s.maxLife;
    ctx.fillStyle = `rgba(190,195,210,${0.28 * (1 - t)})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ================= 标题 ================= */
function drawTitle() {
  const size = Math.min(W * 0.13, 74);
  const y = H * 0.155 + Math.sin(time * 1.3) * 5;

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = `900 ${size}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.shadowColor = 'rgba(255,160,210,0.85)';
  ctx.shadowBlur = 42;

  const g = ctx.createLinearGradient(0, y - size * 0.62, 0, y + size * 0.62);
  g.addColorStop(0,    '#fffbe8');
  g.addColorStop(0.45, '#ffe0f0');
  g.addColorStop(1,    '#c9b4ff');
  ctx.fillStyle = g;
  ctx.fillText('生辰喜乐', W / 2, y);

  ctx.shadowBlur = 18;
  ctx.font = `${Math.max(12, size * 0.22)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.fillText('H A P P Y   B I R T H D A Y', W / 2, y + size * 0.98);

  // 底部提示
  ctx.shadowBlur = 0;
  ctx.font = `${Math.max(11, W * 0.017)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.26)';
  ctx.fillText('点击屏幕 · 吹蜡烛 / 重新点燃', W / 2, H - 26);

  ctx.restore();
}

/* ================= 交互 ================= */
window.addEventListener('pointermove', function (e) {
  mouseX = (e.clientX / W - 0.5) * 2;
  mouseY = (e.clientY / H - 0.5) * 2;
});

canvas.addEventListener('pointerdown', function (e) {
  const mx = e.clientX;
  const my = e.clientY;

  if (targetLight > 0.5) {
    targetLight = 0;
    boom(mx, my);
  } else {
    targetLight = 1;
    boom(mx, my);
  }
});

/* ================= 主循环 ================= */
let last = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  time += dt;
  angle += 0.011 * (dt / 0.016);

  candleLight += (targetLight - candleLight) * 0.055;

  // 熄灭过程中冒烟
  if (targetLight < 0.5 && candleLight > 0.05 && Math.random() < 0.5) {
    const p = project(0, 229, 0);
    spawnSmoke(p.x, p.y - 8 * S);
  }

  parX += (mouseX * 16 - parX) * 0.05;
  parY += (mouseY * 10 - parY) * 0.05;
  baseX = W / 2 + parX;
  baseY = H * 0.76 + parY;

  drawBackground();
  drawCake();
  updateParticles();
  drawParticles();
  drawTitle();

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

})();
</script>
</body>
</html>
